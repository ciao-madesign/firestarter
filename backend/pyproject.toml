[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firestarter"
version = "0.1.0"
description = "Orchestratore open source di progetti complessi: piani, strumenti, artefatti e verifiche."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
firestarter = "firestarter.__main__:main"

[tool.setuptools.packages.find]
include = ["firestarter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
