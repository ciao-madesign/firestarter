# Avvio: LAB_PASSWORD='scegli-una-password' docker compose up -d --build
services:
  lab:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # solo locale: l'accesso da fuori passa da Tailscale (serve/funnel)
    environment:
      LAB_PASSWORD: ${LAB_PASSWORD:?imposta LAB_PASSWORD}
      LAB_TRUST_PROXY: "1"
    volumes:
      - ${LAB_DATA:-./data}:/data    # sul Wyse: punta all'SSD esterno, es. /mnt/ssd/lab
